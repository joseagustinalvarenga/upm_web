<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: head}"></head><body><header class="navbar navbar-dark bg-dark p-2"><a class="navbar-brand px-3" href="/admin/dashboard">Administración UPM</a></header><div class="container-fluid"><div class="row"><nav th:replace="~{fragments/admin_nav :: admin_nav}"></nav><main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4"><h1 class="h2" th:text="${video.id == null ? 'Agregar video navideño' : 'Editar video navideño'}"></h1>
<form th:action="@{/admin/navidad/videos}" th:object="${video}" method="post" enctype="multipart/form-data" class="card p-4 mt-4" style="max-width:800px"><input type="hidden" th:field="*{id}"><div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert"><p class="mb-1">Revisá los siguientes datos:</p><ul class="mb-0"><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul></div>
<div class="mb-3"><label for="title" class="form-label">Título</label><input id="title" class="form-control" th:field="*{title}" required maxlength="140"></div>
<div class="mb-3"><label for="description" class="form-label">Descripción breve</label><textarea id="description" class="form-control" th:field="*{description}" rows="3" maxlength="500"></textarea></div>
<div class="mb-3"><label for="category" class="form-label">Categoría</label><input id="category" class="form-control" th:field="*{category}" required maxlength="60" list="category-options"><datalist id="category-options"><option value="Cocina"></option><option value="Decoración"></option><option value="Manualidades"></option></datalist><small class="text-muted">Elegí una sugerencia o escribí tu propia categoría.</small></div>
<div class="mb-3"><label for="videoUrl" class="form-label">Enlace del video</label><input id="videoUrl" class="form-control" th:field="*{videoUrl}" type="url" required maxlength="1000" placeholder="https://www.youtube.com/watch?v=..."><small class="text-muted">YouTube, Instagram, TikTok o Facebook. Usá un enlace HTTPS y comprobá que tus alumnos puedan verlo.</small></div>
<div class="mb-3"><label for="imageFile" class="form-label">Portada (opcional)</label><input id="imageFile" name="imageFile" type="file" accept="image/jpeg,image/png" class="form-control"><small class="text-muted">JPG o PNG, hasta 5 MB. Si no cargás una imagen, se usa una portada navideña.</small><div th:if="${video.cover != null}" class="mt-3"><img th:src="${video.cover}" alt="Portada actual" style="width:220px;max-width:100%;border-radius:10px"><div class="form-check mt-2"><input id="removeCover" name="removeCover" type="checkbox" value="true" class="form-check-input"><label for="removeCover" class="form-check-label">Quitar portada actual</label></div></div></div>
<div class="mb-3"><label for="displayOrder" class="form-label">Orden de aparición</label><input id="displayOrder" class="form-control" th:field="*{displayOrder}" type="number" min="0" max="9999" required></div><div class="form-check mb-4"><input id="visible" class="form-check-input" th:field="*{visible}" type="checkbox"><label for="visible" class="form-check-label">Visible para alumnos</label></div><div><button class="btn btn-primary" type="submit">Guardar video</button><a class="btn btn-outline-secondary ms-2" href="/admin/navidad">Volver</a></div></form></main></div></div></body></html>
