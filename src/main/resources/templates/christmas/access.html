<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/header :: head}"></th:block>
    <link rel="stylesheet" href="/css/christmas.css">
    <link rel="stylesheet" href="/css/christmas-login.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body class="christmas-page christmas-login-page">
<nav th:replace="~{fragments/header :: nav}"></nav>
<main class="christmas-login-scene">
    <section class="christmas-login" aria-labelledby="access-title">
        <div class="christmas-login-emblem" aria-hidden="true">
            <img class="christmas-lock-image" src="/images/christmas-lock.png" alt="" width="132" height="100">
        </div>
        <h1 id="access-title">Un regalo para<br>seguir aprendiendo</h1>
        <p>Ingresá el código que te compartimos en UPM.</p>
        <div th:if="${error}" class="alert alert-danger text-start" role="alert" th:text="${error}"></div>
        <form th:action="@{/navidad/ingresar}" method="post">
            <label for="code" class="form-label fw-bold">Código de acceso</label>
            <input id="code" name="code" type="password" class="form-control form-control-lg" required maxlength="64" autocomplete="off" aria-describedby="code-help">
            <span id="code-help" class="visually-hidden">Ingresá el código que recibiste de tu docente.</span>
            <button class="christmas-button w-100" type="submit">Ingresar al especial</button>
        </form>
        <div class="christmas-note"><i class="bi bi-mortarboard-fill me-2" aria-hidden="true"></i>Exclusivo para alumnos</div>
    </section>
</main>
</body>
</html>
